    const colorSchemes = {
      yellow: {
        U: { value: '#FFFF00' },
        D: { value: '#FFFFFF' },
        F: { value: '#0000FF' },

        R: { value: '#FF0000' },

    function cleanAlgorithm(alg) {
      return alg.replace(/[[\](){}]/g, '').trim();
    }

    function invertMove(move) {
      if (!move) return '';
      const baseMove = move[0];
      const modifier = move.slice(1);
      if (modifier === "2'") return move;
      if (modifier === '2') return move;
      if (modifier === "'") return baseMove;
      return baseMove + "'";
    }

    function invertAlgorithm(algorithm) {
      const cleanedAlg = cleanAlgorithm(algorithm);
      const withSpaces = cleanedAlg.replace(/([A-Z])(?=[A-Z])/g, '$1 ');
      const moves = withSpaces.split(/\s+/);
      return moves.reverse().map(move => invertMove(move)).join(' ');
    }

    // Generate one OLL SVG inside a container
    function generatePuzzleImage(scramble, container, size) {
      const options = {
        width: size,
        height: size,
        puzzle: {
          scheme: colorSchemes[currentColorScheme],
          size: 3,
          alg: scramble,
          mask: puzzleGen.Masks.CUBE_3.OLL
        }
      };
      try {
        container.innerHTML = '';
        puzzleGen.SVG(container, 'cube-top', options);
      } catch (error) {
        console.error('Error generating case image:', error);
      }
    }

    // Make an element draggable within its parent and selectable
    function makeDraggable(element, container) {
      let isDragging = false;
      let offsetX, offsetY;

      element.addEventListener('mousedown', function(e) {
        e.stopPropagation();
        selectElement(element);
        isDragging = true;
        const rect = element.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
      });

      document.addEventListener('mousemove', function(e) {
        if (isDragging && selectedElement === element) {
          const containerRect = container.getBoundingClientRect();
          let left = e.clientX - offsetX - containerRect.left;
          let top  = e.clientY - offsetY - containerRect.top;
          const elRect = element.getBoundingClientRect();

          left = Math.max(0, Math.min(left, containerRect.width - elRect.width));
          top  = Math.max(0, Math.min(top, containerRect.height - elRect.height));

          element.style.left = left + 'px';
          element.style.top  = top + 'px';
          updateXYInputs(left, top);
        }
      });

      document.addEventListener('mouseup', function() {
        isDragging = false;
      });
    }

    // Clear any existing selection highlight
    function clearSelection() {
      if (selectedElement) {
        selectedElement.classList.remove('selected');
        selectedElement = null;
      }
      xPosInput.value = 0;
      yPosInput.value = 0;
    }

    // Mark an element as selected and update X/Y inputs
    function selectElement(el) {
      clearSelection();
      selectedElement = el;
      el.classList.add('selected');
      const left = parseInt(el.style.left) || 0;
      const top  = parseInt(el.style.top)  || 0;
      xPosInput.value = left;
      yPosInput.value = top;
    }

    // Update X/Y input values when dragging
    function updateXYInputs(x, y) {
      xPosInput.value = Math.round(x);
      yPosInput.value = Math.round(y);
    }

    // Apply styles to all preview elements
    function applyStyles() {
      const nameFont  = nameFontSelect.value;
      const nameColor = nameTextColor.value;
      const nameSize  = nameFontSize.value + 'px';
      const algFont   = algFontSelect.value;
      const algColor  = algTextColor.value;
      const algSize   = algFontSize.value + 'px';
      const svgSize   = parseInt(svgSizeInput.value, 10);

      document.querySelectorAll('.name-element').forEach(el => {
        el.style.fontFamily = nameFont;
        el.style.color      = nameColor;
        el.style.fontSize   = nameSize;
      });
      document.querySelectorAll('.alg-element').forEach(el => {
        el.style.fontFamily = algFont;
        el.style.color      = algColor;
        el.style.fontSize   = algSize;
      });
      document.querySelectorAll('.svg-element').forEach(el => {
        el.style.width  = svgSize + 'px';
        el.style.height = svgSize + 'px';
      });
    }

    // Render the 1920×1080 preview for the first OLL case
    function renderPrintPreview() {
      printPreviewGrid.innerHTML = '';
      clearSelection();

      const caseData = cases[0];
      const container = document.createElement('div');
      container.className = 'print-preview-card';

      // Fetch current settings
      const svgSize    = parseInt(svgSizeInput.value, 10);
      const nameFont   = nameFontSelect.value;
      const nameColor  = nameTextColor.value;
      const nameSize   = nameFontSize.value + 'px';
      const algFont    = algFontSelect.value;
      const algColor   = algTextColor.value;
      const algSize    = algFontSize.value + 'px';

      // SVG
      const svgWrapper = document.createElement('div');
      svgWrapper.className = 'draggable svg-element';
      svgWrapper.style.left = preset.svgX + 'px';
      svgWrapper.style.top  = preset.svgY + 'px';
      generatePuzzleImage(invertAlgorithm(caseData.algorithms[0]), svgWrapper, svgSize);
      makeDraggable(svgWrapper, container);
      container.appendChild(svgWrapper);

      // Name text (centered under SVG)
      const nameWrapper = document.createElement('div');
      nameWrapper.className = 'draggable text-element name-element';
      nameWrapper.textContent = caseData.name;
      nameWrapper.style.fontFamily = nameFont;
      nameWrapper.style.color      = nameColor;
      nameWrapper.style.fontSize   = nameSize;
      nameWrapper.style.whiteSpace = 'nowrap';
      container.appendChild(nameWrapper);
      // After appending, measure and center under the SVG:
      const nameWidth = nameWrapper.offsetWidth;
      const nameLeft = preset.svgX + (svgSize - nameWidth) / 2;
      nameWrapper.style.left = nameLeft + 'px';
      nameWrapper.style.top  = preset.nameY + 'px';
      makeDraggable(nameWrapper, container);

      // Algorithm text (centered horizontally)
      const algWrapper = document.createElement('div');
      algWrapper.className = 'draggable text-element alg-element';
      algWrapper.textContent = caseData.algorithms[0];
      algWrapper.style.fontFamily = algFont;
      algWrapper.style.color      = algColor;
      algWrapper.style.fontSize   = algSize;
      algWrapper.style.whiteSpace = 'nowrap';
      container.appendChild(algWrapper);
      // After appending, measure and center horizontally:
      const algWidth = algWrapper.offsetWidth;
      const algLeft = (1920 - algWidth) / 2;
      algWrapper.style.left = algLeft + 'px';
      algWrapper.style.top  = preset.algY + 'px';
      makeDraggable(algWrapper, container);

      printPreviewGrid.appendChild(container);
      applyStyles();
    }

    // Alignment functions
    function alignLeft() {
      if (!selectedElement) return;
      selectedElement.style.left = '0px';
      updateXYInputs(0, parseInt(selectedElement.style.top) || 0);
    }
    function alignCenter() {
      if (!selectedElement) return;
      const parentWidth = 1920;
      const elWidth = selectedElement.offsetWidth;
      const newLeft = (parentWidth - elWidth) / 2;
      selectedElement.style.left = newLeft + 'px';
      updateXYInputs(newLeft, parseInt(selectedElement.style.top) || 0);
    }
    function alignRight() {
      if (!selectedElement) return;
      const parentWidth = 1920;
      const elWidth = selectedElement.offsetWidth;
      const newLeft = parentWidth - elWidth;
      selectedElement.style.left = newLeft + 'px';
      updateXYInputs(newLeft, parseInt(selectedElement.style.top) || 0);
    }

    // Update selected element’s position when inputs change
    xPosInput.addEventListener('input', () => {
      if (!selectedElement) return;
      const newX = parseInt(xPosInput.value) || 0;
      selectedElement.style.left = newX + 'px';
    });
    yPosInput.addEventListener('input', () => {
      if (!selectedElement) return;
      const newY = parseInt(yPosInput.value) || 0;
      selectedElement.style.top = newY + 'px';
    });

    // Re-render when any control changes
    svgSizeInput.oninput      = renderPrintPreview;
    nameFontSelect.onchange   = renderPrintPreview;
    nameTextColor.oninput     = renderPrintPreview;
    nameFontSize.oninput      = renderPrintPreview;
    algFontSelect.onchange    = renderPrintPreview;
    algTextColor.oninput      = renderPrintPreview;
    algFontSize.oninput       = renderPrintPreview;

    // Wire up alignment buttons
    alignLeftBtn.addEventListener('click', alignLeft);
    alignCenterBtn.addEventListener('click', alignCenter);
    alignRightBtn.addEventListener('click', alignRight);

    // ============================
    // Main export loop (4K output)
    // ============================
    printPNGsBtn.onclick = async function() {
      printPNGsBtn.disabled = true;
      printPNGsBtn.textContent = 'Processing...';
      progressMessage.textContent = 'Starting 4K PNG export...';

      const exportContainer = document.getElementById('exportContainer');
      const previewSvg  = document.querySelector('.svg-element');
      const previewName = document.querySelector('.name-element');
      const previewAlg  = document.querySelector('.alg-element');

      // Grab positions from 1920×1080 preview
      const svgPosX1920 = parseFloat(previewSvg.style.left);
      const svgPosY1920 = parseFloat(previewSvg.style.top);
      const namePosX1920 = parseFloat(previewName.style.left);
      const namePosY1920 = parseFloat(previewName.style.top);
      // For alg, center horizontally on export

      const scaleFactor = 2; // 4K is double each dimension of 1080p

      const svgSize1920 = parseInt(svgSizeInput.value, 10);
      const svgSize3840 = svgSize1920 * scaleFactor;
      const nameFontSize1920 = parseInt(nameFontSize.value, 10);
      const nameFontSize3840 = nameFontSize1920 * scaleFactor;
      const algFontSize1920 = parseInt(algFontSize.value, 10);
      const algFontSize3840 = algFontSize1920 * scaleFactor;

      const nameFont = nameFontSelect.value;
      const nameColor = nameTextColor.value;
      const algFont  = algFontSelect.value;
      const algColor = algTextColor.value;

      const zip = new JSZip();
      let renderedCount = 0;
      const totalCases = cases.length;

      for (const caseData of cases) {
        // Clear and size exportContainer for 3840×2160 (16:9)
        exportContainer.innerHTML = '';
        exportContainer.style.width  = '3840px';
        exportContainer.style.height = '2160px';
        exportContainer.style.background = 'transparent';

        // --- SVG at 4K positions/sizes ---
        const svgWrapper = document.createElement('div');
        svgWrapper.className = 'draggable svg-element';
        svgWrapper.style.left   = (svgPosX1920 * scaleFactor) + 'px';
        svgWrapper.style.top    = (svgPosY1920 * scaleFactor) + 'px';
        svgWrapper.style.width  = svgSize3840 + 'px';
        svgWrapper.style.height = svgSize3840 + 'px';
        generatePuzzleImage(invertAlgorithm(caseData.algorithms[0]), svgWrapper, svgSize3840);
        exportContainer.appendChild(svgWrapper);

        // --- Name text at 4K positions/sizes (centered under SVG) ---
        const nameWrapper = document.createElement('div');
        nameWrapper.className = 'draggable text-element name-element';
        nameWrapper.textContent      = caseData.name;
        nameWrapper.style.fontFamily = nameFont;
        nameWrapper.style.color      = nameColor;
        nameWrapper.style.fontSize   = nameFontSize3840 + 'px';
        nameWrapper.style.whiteSpace = 'nowrap';
        exportContainer.appendChild(nameWrapper);
        // measure & center under SVG:
        const measuredNameWidth = nameWrapper.offsetWidth;
        const nameLeft4K = (svgPosX1920 * scaleFactor) + (svgSize3840 - measuredNameWidth) / 2;
        const nameTop4K  = (namePosY1920 * scaleFactor);
        nameWrapper.style.left = nameLeft4K + 'px';
        nameWrapper.style.top  = nameTop4K + 'px';

        // --- Algorithm text at 4K positions/sizes, centered horizontally ---
        const algWrapper = document.createElement('div');
        algWrapper.className = 'draggable text-element alg-element';
        algWrapper.textContent      = caseData.algorithms[0];
        algWrapper.style.fontFamily = algFont;
        algWrapper.style.color      = algColor;
        algWrapper.style.fontSize   = algFontSize3840 + 'px';
        algWrapper.style.whiteSpace = 'nowrap';
        exportContainer.appendChild(algWrapper);
        // Measure alg width at 4K then center
        const measuredAlgWidth = algWrapper.offsetWidth;
        const centeredX4K = (3840 - measuredAlgWidth) / 2;
        const algY4K = preset.algY * scaleFactor;
        algWrapper.style.left = centeredX4K + 'px';
        algWrapper.style.top  = algY4K + 'px';

        // Give the browser a moment to update
        await new Promise(res => setTimeout(res, 50));

        try {
          // Capture exactly the 3840×2160 area for a true 16:9 export
          const canvas = await html2canvas(exportContainer, {
            backgroundColor: null,
            width: 3840,
            height: 2160,
            scale: 1
          });

          const dataUrl = canvas.toDataURL('image/png');
          const base64 = dataUrl.split(',')[1];
          const caseName = caseData.name.replace(/[^a-z0-9]/gi, '_');
          zip.file(`${caseName}_4K.png`, base64, { base64: true });

          renderedCount++;
          progressMessage.textContent = `Rendering ${renderedCount}/${totalCases} (4K)…`;
        } catch (err) {
          console.error(`Failed to render case ${caseData.name}:`, err);
          progressMessage.textContent = `Error on ${caseData.name}, continuing…`;
        }
      }

      // ZIP and download
      progressMessage.textContent = 'Zipping 4K files…';
      const blob = await zip.generateAsync({ type: 'blob' });
      saveAs(blob, 'oll_cases_4K.zip');

      printPNGsBtn.disabled = false;
      printPNGsBtn.textContent = 'Export PNGs (ZIP)';
      progressMessage.textContent = 'Export complete!';
      setTimeout(() => progressMessage.textContent = '', 3000);
    };
  </script>
</body>
</html>
