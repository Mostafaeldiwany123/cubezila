<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/img/demo (2).png">
    <title data-translate="login_title">Login - Cubezilla</title>
    <script src="../../bg/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/roots.css">
    <!-- Cubing Icons -->
    <link rel="stylesheet" href="https://cdn.cubing.net/v0/css/@cubing/icons/css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GD9J5DTDPS"></script>
    <script>
      // Only load GA on cubezila.com
      if (window.location.hostname === 'cubezila.com') {
        window.dataLayer = window.dataLayer || [];
        function gtag(){ dataLayer.push(arguments); }
        gtag('js', new Date());

        // ensure cookies are scoped to your domain
        gtag('config', 'G-GD9J5DTDPS', {
          'cookie_domain': 'cubezila.com'
        });
      }
    </script>
</head>
<body>
    <div class="auth-layout">
        <div class="auth-form-container">
            <div class="form-wrapper">
                <a href="../index.html" class="back-link" data-translate="auth_back_home"><i class="fas fa-arrow-left"></i> Back to Home</a>
                <h2 data-translate="login_title">Login</h2>
                <p class="auth-description" data-translate="login_description">Enter your credentials to access your account.</p>
                <div class="error-message" id="errorMessage"></div>
                <form id="loginForm" class="form-container">
                    <div class="form-group">
                        <label for="loginEmail" data-translate="login_email">Email</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword" data-translate="login_password">Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" id="loginButton">
                        <span data-translate="login_button">Login</span>
                    </button>
                </form>
                <div class="or-divider"><span data-translate="or_divider">or</span></div>
                <button id="googleSignInButton" class="google-btn">
                    <i class="fab fa-google"></i>
                    <span data-translate="login_google">Sign in with Google</span>
                </button>
                <p class="register-link">
                    <span data-translate="register_link_prompt">Don't have an account?</span> <a href="register.html" data-translate="register_link_text">Register here</a>
                </p>
            </div>
        </div>
        <div class="auth-image-container">
            <div class="right-panel-content">
                <div class="logo">
                    <i class="cubing-icon event-333"></i>
                    <span>CubeZila</span>
                </div>
                <h2 data-translate="welcome_back_title">Welcome Back!</h2>
                <p data-translate="welcome_back_desc">Log in to continue your speedcubing journey. Track your progress, learn new algorithms, and connect with the community.</p>
            </div>
        </div>
    </div>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script> <!-- Added Firestore SDK -->
    <!-- Modular Firebase Scripts -->
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/user-service.js"></script>
    <script type="module" src="../js/auth-service.js"></script>
    <script type="module" src="auth.js"></script>
    <script type="module" src="../language/language.js"></script>
</body>
</html>
