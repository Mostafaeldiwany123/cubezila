<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CubeZila</title>
    <link rel="icon" type="image/png" href="../img/demo (2).png">
    <script src="../bg/theme.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/roots.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <!-- Loading Overlay for Auth Check -->
    <div id="auth-loading-overlay">
        <div class="spinner"></div>
        <p>Verifying permissions...</p>
    </div>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="../index.html" class="logo">
                    <i class="fas fa-cube"></i>
                    <span>CubeZila Admin</span>
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-target="users">
                    <i class="fas fa-users"></i>
                    <span>User Management</span>
                </a>
                <a href="#" class="nav-item" data-target="permissions">
                    <i class="fas fa-shield-alt"></i>
                    <span>Subadmin Permissions</span>
                </a>
            </nav>
        </aside>
        <main class="main-content">
            <header class="main-header">
                <h1 id="page-title">User Management</h1>
            </header>
            <div class="content-area">
                <!-- User Management Page -->
                <div id="users-page" class="page active">
                    <div class="toolbar">
                        <div class="search-bar">
                            <i class="fas fa-search"></i>
                            <input type="text" id="userSearch" placeholder="Search by name or email...">
                        </div>
                        <div class="toolbar-right-group">
                            <div class="actions">
                                <button id="createUserBtn" class="btn btn-primary">
                                    <i class="fas fa-plus"></i> Create User
                                </button>
                            </div>
                            <div class="sort-controls">
                                <label for="sortBy">Sort by:</label>
                                <select id="sortBy">
                                    <option value="createdAt" selected>Date Created</option>
                                    <option value="username">Username</option>
                                    <option value="email">Email</option>
                                    <option value="role">Role</option>
                                </select>
                                <button id="sortDirBtn" title="Change sort direction">
                                    <i class="fas fa-arrow-down-long"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="table-container">
                        <table id="usersTable">
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Created At</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- User rows will be inserted here by JS -->
                            </tbody>
                        </table>
                    </div>
                    <div id="loading-indicator">
                        <i class="fas fa-spinner fa-spin"></i> Loading users...
                    </div>
                </div>

                <!-- Subadmin Permissions Page -->
                <div id="permissions-page" class="page">
                    <h2>Manage Subadmin Permissions</h2>
                    <p>Define what actions subadmins are allowed to perform. (Coming soon)</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Create User Modal -->
    <div id="createUserModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h2>Create New User</h2>
            <div class="error-message" id="modalErrorMessage"></div>
            <form id="createUserForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label for="role">Role</label>
                    <select id="role">
                        <option value="free_user" selected>Free User</option>
                        <option value="pro_user">Pro User</option>
                        <option value="subadmin">Subadmin</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button type="submit" id="submitUserBtn" class="btn btn-primary">
                    <span>Create User</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <!-- Modular Firebase Scripts -->
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/user-service.js"></script>
    <script type="module" src="../js/auth-service.js"></script>
    <!-- Page Specific Scripts -->
    <script type="module" src="admin-auth-guard.js"></script>
    <script type="module" src="dashboard.js"></script>
</body>
</html>
