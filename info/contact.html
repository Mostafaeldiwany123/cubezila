<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Cubezila</title>
    <script src="../bg/theme.js"></script>
    <link rel="icon" type="image/png" href="../img/demo (2).png">
    <link rel="apple-touch-icon" href="../img/demo (2).png">
    <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/roots.css">
    <link rel="stylesheet" href="../css/index.css">
    <style>
        .contact-content {
            width: 800px;
            margin: 4rem auto;
            padding: 2.5rem;
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
        }

        .contact-form {
            margin-top: 2rem;
            padding: 2rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-secondary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .form-group input:hover,
        .form-group textarea:hover {
            border-color: #cccccc;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #b0b0b0;
            box-shadow: 0 0 0 1px #b0b0b0;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            background: var(--accent-color);
            color: white;
            padding: 0.875rem 1.5rem;
            border: 2px solid var(--accent-color);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            background: transparent;
            color: var(--accent-color);
        }

        .contact-info {
            margin-top: 2.5rem;
            padding: 2rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-secondary);
        }

        .contact-info h2 {
            color: var(--text-primary);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border-color);
        }

        .contact-info-item {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1rem;
            padding: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
            background: var(--bg-primary);
        }

        .contact-info-item:hover {
            border-color: #cccccc;
        }

        .contact-info-item:last-child {
            margin-bottom: 0;
        }

        .contact-info-item i {
            color: var(--accent-color);
            font-size: 1.1rem;
            width: 24px;
            margin-right: 1rem;
        }

        .contact-info-item a {
            color: var(--accent-color);
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .contact-info-item a:hover {
            opacity: 0.8;
        }

        @media (max-width: 850px) {
            .contact-content {
                width: auto;
                margin: 2rem 1rem;
                padding: 1.5rem;
            }
            .contact-form,
            .contact-info {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a href="../index.html" class="logo">
            <img src="../img/demo (1).png" alt="Cube Logo">
            <span>Cubezila</span>
        </a>
    </header>

    <main>
        <div class="contact-content">
            <h1>Contact Us</h1>
            
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Send Message</button>
            </form>

            <div class="contact-info">
                <h2>Other Ways to Reach Us</h2>
                <div class="contact-info-item">
                    <i class="fas fa-envelope"></i>
                    Email: cubezila313@gmail.com
                </div>
                <div class="contact-info-item">
                    <i class="fas fa-clock"></i>
                    Response Time: Within 24 hours
                </div>
                <div class="contact-info-item">
                    <i class="fas fa-info-circle"></i>
                    For immediate assistance, check our <a href="../faq.html">FAQ page</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you for your message! We will get back to you soon.');
            this.reset();
        });
    </script>
    
</body>
</html>
