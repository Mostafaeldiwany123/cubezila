<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CubeZila</title>
    <link rel="icon" type="image/png" href="../img/demo (2).png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/roots.css">
    <link rel="stylesheet" href="profile.css">
    <script src="../bg/theme.js"></script>
</head>
<body>
    <div class="profile-container">
        <div class="profile-card">
            <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
            <div class="profile-header">
                <div class="avatar" id="userAvatar"></div>
                <h2 id="userName">Loading...</h2>
            </div>
            <div class="profile-details">
                <div class="detail-item">
                    <span class="label"><i class="fas fa-envelope"></i> Email</span>
                    <span class="value" id="userEmail">...</span>
                </div>
                <div class="detail-item">
                    <span class="label"><i class="fas fa-user-shield"></i> Role</span>
                    <span class="value" id="userRole">...</span>
                </div>
                <div class="detail-item">
                    <span class="label"><i class="fas fa-calendar-alt"></i> Member Since</span>
                    <span class="value" id="memberSince">...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <!-- Modular Firebase Scripts -->
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/auth-service.js"></script>
    <script type="module" src="profile.js"></script>
</body>
</html>
